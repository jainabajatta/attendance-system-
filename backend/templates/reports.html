<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - Vision Attendance System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', sans-serif;
        }

        .reports-container {
            padding: 20px;
        }

        .report-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .chart-container {
            height: 300px;
            margin: 20px 0;
        }

        .table-container {
            max-height: 400px;
            overflow-y: auto;
        }

        .export-btn {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            transition: all 0.3s;
        }

        .export-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .filter-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="reports-container">
        <div class="container-fluid">
            <!-- Header -->
            <div class="row mb-4">
                <div class="col">
                    <h1 class="text-white">
                        <i class="fas fa-chart-bar me-2"></i>
                        Attendance Reports
                    </h1>
                    <p class="text-white-50">View and export attendance analytics</p>
                </div>
                <div class="col text-end">
                    <button class="btn btn-light" onclick="location.href='/dashboard'">
                        <i class="fas fa-arrow-left me-2"></i>Back to Dashboard
                    </button>
                </div>
            </div>

            <!-- Filter Section -->
            <div class="filter-section">
                <div class="row">
                    <div class="col-md-4">
                        <label class="form-label">Date From</label>
                        <input type="date" class="form-control" id="dateFrom">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Date To</label>
                        <input type="date" class="form-control" id="dateTo">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">&nbsp;</label>
                        <button class="btn btn-primary d-block w-100" onclick="loadReport()">
                            <i class="fas fa-search me-2"></i>Generate Report
                        </button>
                    </div>
                </div>
            </div>

            <!-- Statistics Cards -->
            <div class="row mb-4">
                <div class="col-md-3">
                    <div class="report-card">
                        <i class="fas fa-users fa-2x text-primary mb-2"></i>
                        <h3 id="totalEmployees">0</h3>
                        <div>Total Employees</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="report-card">
                        <i class="fas fa-calendar-check fa-2x text-success mb-2"></i>
                        <h3 id="totalPresent">0</h3>
                        <div>Total Present</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="report-card">
                        <i class="fas fa-calendar-times fa-2x text-danger mb-2"></i>
                        <h3 id="totalAbsent">0</h3>
                        <div>Total Absent</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="report-card">
                        <i class="fas fa-chart-line fa-2x text-info mb-2"></i>
                        <h3 id="attendanceRate">0%</h3>
                        <div>Attendance Rate</div>
                    </div>
                </div>
            </div>

            <!-- Charts -->
            <div class="row">
                <div class="col-md-6">
                    <div class="report-card">
                        <h5><i class="fas fa-chart-pie me-2"></i>Attendance Distribution</h5>
                        <div class="chart-container">
                            <canvas id="pieChart"></canvas>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="report-card">
                        <h5><i class="fas fa-chart-line me-2"></i>Weekly Trend</h5>
                        <div class="chart-container">
                            <canvas id="lineChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Attendance Table -->
            <div class="report-card">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5><i class="fas fa-table me-2"></i>Attendance Records</h5>
                    <button class="export-btn" onclick="exportReport()">
                        <i class="fas fa-download me-2"></i>Export to Excel
                    </button>
                </div>
                <div class="table-container">
                    <table class="table table-hover" id="attendanceTable">
                        <thead class="table-light">
                            <tr>
                                <th>Name</th>
                                <th>Employee ID</th>
                                <th>Department</th>
                                <th>Date</th>
                                <th>Time</th>
                                <th>Confidence</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="attendanceTableBody">
                            <tr>
                                <td colspan="7" class="text-center text-muted">
                                    <i class="fas fa-calendar fa-2x mb-2 d-block"></i>
                                    Select date range to view records
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let pieChart = null;
        let lineChart = null;
        
        // Set default dates
        const today = new Date();
        const weekAgo = new Date();
        weekAgo.setDate(today.getDate() - 7);
        
        document.getElementById('dateTo').value = today.toISOString().split('T')[0];
        document.getElementById('dateFrom').value = weekAgo.toISOString().split('T')[0];
        
        // Load report
        async function loadReport() {
            const dateFrom = document.getElementById('dateFrom').value;
            const dateTo = document.getElementById('dateTo').value;
            
            if (!dateFrom || !dateTo) {
                alert('Please select date range');
                return;
            }
            
            try {
                const response = await fetch(`/api/attendance/date/${dateFrom}?to=${dateTo}`);
                const records = await response.json();
                
                updateStatistics(records);
                updateTable(records);
                updateCharts(records);
                
            } catch (error) {
                console.error('Error loading report:', error);
                alert('Error loading report');
            }
        }
        
        // Update statistics
        function updateStatistics(records) {
            const totalEmployees = 50; // This should come from API
            const totalPresent = records.length;
            const totalAbsent = totalEmployees - totalPresent;
            const attendanceRate = totalEmployees > 0 ? (totalPresent / totalEmployees * 100).toFixed(1) : 0;
            
            document.getElementById('totalEmployees').textContent = totalEmployees;
            document.getElementById('totalPresent').textContent = totalPresent;
            document.getElementById('totalAbsent').textContent = totalAbsent;
            document.getElementById('attendanceRate').textContent = `${attendanceRate}%`;
        }
        
        // Update table
        function updateTable(records) {
            const tbody = document.getElementById('attendanceTableBody');
            tbody.innerHTML = '';
            
            if (records.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="text-center text-muted">
                            <i class="fas fa-inbox fa-2x mb-2 d-block"></i>
                            No records found for selected date range
                        </td>
                    </tr>
                `;
                return;
            }
            
            records.forEach(record => {
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td>${record.name}</td>
                    <td>${record.employee_id}</td>
                    <td>${record.department}</td>
                    <td>${record.date}</td>
                    <td>${record.time}</td                     <td>${record.confidence}%</td>
                     <td><span class="badge bg-success">Present</span></td>
                `;
            });
        }
        
        // Update charts
        function updateCharts(records) {
            // Prepare data for pie chart
            const departments = {};
            records.forEach(record => {
                departments[record.department] = (departments[record.department] || 0) + 1;
            });
            
            const pieData = {
                labels: Object.keys(departments),
                datasets: [{
                    data: Object.values(departments),
                    backgroundColor: ['#667eea', '#764ba2', '#f093fb', '#4facfe', '#43e97b', '#fa709a']
                }]
            };
            
            // Prepare data for line chart (daily trend)
            const dailyCount = {};
            records.forEach(record => {
                dailyCount[record.date] = (dailyCount[record.date] || 0) + 1;
            });
            
            const dates = Object.keys(dailyCount).sort();
            const counts = dates.map(date => dailyCount[date]);
            
            const lineData = {
                labels: dates,
                datasets: [{
                    label: 'Attendance Count',
                    data: counts,
                    borderColor: '#667eea',
                    backgroundColor: 'rgba(102, 126, 234, 0.1)',
                    tension: 0.4,
                    fill: true
                }]
            };
            
            // Update pie chart
            if (pieChart) {
                pieChart.destroy();
            }
            pieChart = new Chart(document.getElementById('pieChart'), {
                type: 'pie',
                data: pieData,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });
            
            // Update line chart
            if (lineChart) {
                lineChart.destroy();
            }
            lineChart = new Chart(document.getElementById('lineChart'), {
                type: 'line',
                data: lineData,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'Number of Employees'
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: 'Date'
                            }
                        }
                    }
                }
            });
        }
        
        // Export report
        async function exportReport() {
            const dateFrom = document.getElementById('dateFrom').value;
            const dateTo = document.getElementById('dateTo').value;
            
            if (!dateFrom || !dateTo) {
                alert('Please select date range');
                return;
            }
            
            try {
                window.location.href = `/api/attendance/export?date_from=${dateFrom}&date_to=${dateTo}&format=excel`;
            } catch (error) {
                console.error('Error exporting report:', error);
                alert('Error exporting report');
            }
        }
        
        // Load report on page load
        loadReport();
    </script>
</body>
</html>
