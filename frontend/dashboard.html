<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Vision Attendance System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #fff;
            display: flex;
            flex-direction: column;
        }

        .main-wrapper {
            flex: 1 0 auto;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
        }

        .dashboard-container {
            padding-top: 30px;
            padding-bottom: 50px;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
        }

        .panel-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        /* Camera Stream Styling */
        .video-feed-wrapper {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            aspect-ratio: 16 / 9;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .video-feed-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .camera-placeholder {
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
        }

        .camera-placeholder i {
            font-size: 4rem;
            margin-bottom: 15px;
        }

        /* Activity Log & Table custom styling */
        .custom-table {
            color: #fff;
            margin-bottom: 0;
        }

        .custom-table th {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7);
        }

        .custom-table td {
            padding: 12px 8px;
            vertical-align: middle;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .log-container {
            max-height: 380px;
            overflow-y: auto;
        }

        /* System Controls Layout */
        .btn-control {
            border: none;
            padding: 12px 20px;
            font-weight: 600;
            border-radius: 10px;
            transition: all 0.2s ease;
            width: 100%;
            margin-bottom: 12px;
        }

        .btn-start { background: #2af598; color: #111; }
        .btn-start:hover { background: #22c97d; transform: translateY(-2px); }
        .btn-stop { background: #ff4b5c; color: #fff; }
        .btn-stop:hover { background: #e03e4e; transform: translateY(-2px); }

        /* Custom Scrollbar for modern feel */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.4); }

        footer {
            background: rgba(0, 0, 0, 0.25);
            padding: 24px;
            text-align: center;
            width: 100%;
            flex-shrink: 0;
            font-size: 0.95rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <nav class="navbar navbar-expand-lg">
            <div class="container">
                <a class="navbar-brand text-white fw-bold" href="/">
                    <i class="fas fa-eye me-2 text-info"></i>
                    VisionAttendance Pro
                </a>
                <button class="btn btn-sm btn-outline-light rounded-pill px-3" onclick="location.href='/'">
                    <i class="fas fa-arrow-left me-1"></i> Home
                </button>
            </div>
        </nav>

        <div class="container dashboard-container">
            <div class="row">
                <div class="col-lg-7">
                    <div class="glass-panel">
                        <div class="panel-title">
                            <i class="fas fa-video me-2 text-info"></i> Live Authentication Engine
                        </div>
                        <div class="video-feed-wrapper" id="video-wrapper">
                            <!-- Removed inline src and onerror to prevent ReferenceErrors during early DOM load -->
                            <img id="video-feed" alt="Live Processing Stream">
                        </div>
                        <div class="mt-3 text-center text-white-50 small">
                            <i class="fas fa-info-circle me-1"></i> Edge compilation bounding boxes automatically highlight detected profiles.
                        </div>
                    </div>
                </div>

                <div class="col-lg-5">
                    <div class="glass-panel">
                        <div class="panel-title">
                            <i class="fas fa-sliders-h me-2 text-warning"></i> Engine Controls
                        </div>
                        <div class="row">
                            <div class="col-6">
                                <button class="btn-control btn-start" onclick="toggleEngine(true)">
                                    <i class="fas fa-play me-2"></i> Resume Cam
                                </button>
                            </div>
                            <div class="col-6">
                                <button class="btn-control btn-stop" onclick="toggleEngine(false)">
                                    <i class="fas fa-pause me-2"></i> Pause Stream
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="glass-panel">
                        <div class="panel-title">
                            <i class="fas fa-history me-2 text-success"></i> Live Attendance Logs
                        </div>
                        <div class="log-container">
                            <table class="table custom-table">
                                <thead>
                                    <tr>
                                        <th>User/Employee</th>
                                        <th>Timestamp</th>
                                        <th>Confidence</th>
                                    </tr>
                                </thead>
                                <tbody id="log-table-body">
                                    <tr id="empty-log-row">
                                        <td colspan="3" class="text-center text-white-50 py-4">
                                            No detection sequences captured yet.
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p class="mb-0">&copy; <span id="copyright-year"></span> VisionAttendance Pro. All rights reserved.</p>
    </footer>

    <script>
        document.getElementById('copyright-year').textContent = new Date().getFullYear();

        // Handles stream load connection errors cleanly
        function handleStreamError() {
            const wrapper = document.getElementById('video-wrapper');
            wrapper.innerHTML = `
                <div class="camera-placeholder">
                    <i class="fas fa-video-slash"></i>
                    <h5>Camera Stream Unreachable</h5>
                    <p class="small text-white-50 px-3">Backend feed offline or running in preview mode.</p>
                </div>`;
        }

        // Initialize the video feed safely from JavaScript after functions are defined
        const feedImg = document.getElementById('video-feed');
        if (feedImg) {
            feedImg.onerror = handleStreamError;
            // Prevent immediate blob protocol crash in the preview environment
            if (window.location.protocol !== 'blob:') {
                feedImg.src = "/video_feed";
            } else {
                handleStreamError();
            }
        }

        // Toggles stream engine connection points seamlessly
        function toggleEngine(start) {
            const feedImg = document.getElementById('video-feed');
            if (!feedImg) return;
            
            if (start) {
                // To restart, we need to reset the inner HTML incase it was replaced by handleStreamError
                const wrapper = document.getElementById('video-wrapper');
                wrapper.innerHTML = `<img id="video-feed" src="/video_feed?${new Date().getTime()}" alt="Live Processing Stream" onerror="handleStreamError()">`;
            } else {
                handleStreamError();
            }
        }

        // Asynchronously polls database for live checkpoint events
        async function fetchRecentLogs() {
            let logs = [];
            
            // Check if running in a sandbox/iframe where relative fetch throws URL parsing errors
            const isSandbox = window.location.href.startsWith('blob:') || window.location.hostname.includes('usercontent.goog');
            
            if (isSandbox) {
                // Provides mock data to visualize UI successfully while disconnected from FastAPI backend
                const t = new Date();
                logs = [
                    { name: "Alice Smith", user_id: "BCS0000227", timestamp: t.toLocaleTimeString(), confidence: "98.4%" },
                    { name: "Bob Jones", user_id: "BCS0000228", timestamp: new Date(t.getTime() - 60000).toLocaleTimeString(), confidence: "95.2%" }
                ];
            } else {
                try {
                    const response = await fetch('/api/recent_logs');
                    if (!response.ok) return;
                    logs = await response.json();
                } catch (err) {
                    console.warn("Could not fetch live logs, backend might be down.");
                    return;
                }
            }

            const tableBody = document.getElementById('log-table-body');
            if (logs.length === 0) return;

            // Strip fallback row if data array structure is initialized
            const fallbackRow = document.getElementById('empty-log-row');
            if (fallbackRow) fallbackRow.remove();

            tableBody.innerHTML = logs.map(log => `
                <tr>
                    <td>
                        <div class="fw-bold">${log.name}</div>
                        <span class="text-white-50 small">ID: ${log.user_id}</span>
                    </td>
                    <td>${log.timestamp}</td>
                    <td>
                        <span class="badge bg-success">${log.confidence || '98.4%'}</span>
                    </td>
                </tr>
            `).join('');
        }

        // Initialize verification workers
        fetchRecentLogs();
        setInterval(fetchRecentLogs, 4000);
    </script>
</body>
</html>
